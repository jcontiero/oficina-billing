apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: oficina-billing-secrets
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/fiap-project-514922/secrets/oficina-billing-ENV_PLACEHOLDER-database-url/versions/latest"
        path: "DATABASE_URL"
      - resourceName: "projects/fiap-project-514922/secrets/oficina-billing-ENV_PLACEHOLDER-mp-access-token/versions/latest"
        path: "MP_ACCESS_TOKEN"
      - resourceName: "projects/fiap-project-514922/secrets/oficina-billing-ENV_PLACEHOLDER-mp-webhook-secret/versions/latest"
        path: "MP_WEBHOOK_SECRET"
  secretObjects:
    - secretName: oficina-billing-secret
      type: Opaque
      data:
        - objectName: DATABASE_URL
          key: DATABASE_URL
        - objectName: MP_ACCESS_TOKEN
          key: MP_ACCESS_TOKEN
        - objectName: MP_WEBHOOK_SECRET
          key: MP_WEBHOOK_SECRET
