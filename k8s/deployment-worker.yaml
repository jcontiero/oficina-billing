apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-billing-worker
  labels:
    app: oficina-billing-worker
    tags.datadoghq.com/service: oficina-billing-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oficina-billing-worker
  template:
    metadata:
      labels:
        app: oficina-billing-worker
        tags.datadoghq.com/service: oficina-billing-worker
    spec:
      serviceAccountName: oficina-billing-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: worker
          image: us-east1-docker.pkg.dev/fiap-project-514922/oficina-docker/oficina-billing:latest
          command: ["python", "-m", "src.worker"]
          envFrom:
            - configMapRef:
                name: oficina-billing-config
            - secretRef:
                name: oficina-billing-secret
          env:
            - name: DD_ENV
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: DD_SERVICE
              value: "oficina-billing-worker"
            - name: DD_AGENT_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: DD_TRACE_AGENT_PORT
              value: "8126"
          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: oficina-billing-secrets
