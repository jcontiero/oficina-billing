name: Deploy

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: "Digite 'true' para autorizar o build/push/migration/deploy do oficina-billing no GKE"
        required: true
        default: "false"

env:
  PROJECT_ID: "fiap-project-514922"
  REGION: "us-east1"
  REPOSITORY: "oficina-docker"
  IMAGE_NAME: "oficina-billing"

concurrency:
  group: deploy-oficina-billing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_deploy == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/homolog')
    environment: ${{ github.ref_name == 'main' && 'production' || 'homolog' }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify Homolog / Production Database Isolation
        env:
          DB_URL_SECRET: ${{ secrets.DB_URL }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          if [ -z "${DB_URL_SECRET}" ]; then
            echo "ERROR: DB_URL secret is empty for ${TARGET_BRANCH}. Aborting."
            exit 1
          fi
          if [ "${TARGET_BRANCH}" = "homolog" ] && ! echo "${DB_URL_SECRET}" | grep -Eq "oficina_billing_homolog"; then
            echo "ERROR: Homolog DB_URL must target oficina_billing_homolog."
            exit 1
          fi
          if [ "${TARGET_BRANCH}" = "main" ] && ! echo "${DB_URL_SECRET}" | grep -Eq "oficina_billing_production"; then
            echo "ERROR: Production DB_URL must target oficina_billing_production."
            exit 1
          fi
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/936717667971/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider'
          service_account: 'github-actions-sa@fiap-project-514922.iam.gserviceaccount.com'
